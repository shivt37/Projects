<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050508">
<title>Projects Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header style="display:flex;align-items:center;gap:var(--s3);padding:var(--s5);border-block-end:1px solid var(--border2)">
  <strong style="font-size:1.1rem">Projects Gateway</strong>
  <form method="post" action="/logout" style="margin-inline-start:auto">
    <button type="submit" style="background:transparent;color:var(--dim);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px">Sign out</button>
  </form>
</header>
<main style="padding:var(--s6);max-inline-size:72rem;margin-inline:auto">
  <h1 style="font-size:1.4rem;margin-block-end:var(--s2)">Gateway scaffold ready</h1>
  <p style="color:var(--dim)">The project browser will be added in the next phase.</p>
</main>
</body>
</html>

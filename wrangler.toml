name = "projects-gateway"
main = "src/index.js"
compatibility_date = "2026-01-01"
keep_vars = true

[[kv_namespaces]]
binding = "GATEWAY"
# Local development uses a local KV emulation. Replace with the real namespace ID before deploying.
id = "00000000000000000000000000000000"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
AUTH_ENABLED = "true"

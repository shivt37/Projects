name = "projects-gateway"
main = "src/index.js"
compatibility_date = "2026-01-01"
keep_vars = true

[[kv_namespaces]]
binding = "GATEWAY"
# Local development uses a local KV emulation. Replace with the real namespace ID before deploying.
id = "6440ae76eba24c96847425e0583f53d6"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# No [vars] here on purpose:
# - AUTH_ENABLED is read from the dashboard (or .dev.vars locally) and defaults to
#   "true" in code when unset, so a dashboard change is never overwritten by a deploy.
# - ADMIN_PIN / SESSION_SECRET are secrets, set only via the dashboard or
#   `wrangler secret put`; deploys never delete or overwrite them.
# keep_vars = true above preserves any other dashboard-configured variables.
